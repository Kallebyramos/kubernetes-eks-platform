apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
spec:
  template:
    metadata:
      labels:
        nodepool: default
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default

      requirements:
        # instance families suited for Spark (compute + memory balanced)
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["m5", "m5a", "r5", "r5a"]

        # allow any size from medium up
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["xlarge", "2xlarge"]

        # prefer spot, fall back to on-demand
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

        # linux only
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]

  # cost guard — Karpenter won't provision beyond these limits
  limits:
    cpu: "40"
    memory: 160Gi

  disruption:
    # consolidate nodes when utilization is low
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 30s

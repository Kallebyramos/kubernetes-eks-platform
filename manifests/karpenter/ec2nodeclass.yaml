apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  # AL2023 is recommended for EKS 1.31+
  amiSelectorTerms:
    - alias: al2023@latest

  # discovers subnets tagged with karpenter.sh/discovery=<cluster-name>
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-spark-lab  # must match var.cluster_name in Terraform

  # discovers the node security group via the same tag
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: eks-spark-lab

  # IAM instance profile created by Terraform
  instanceProfile: KarpenterNodeInstanceProfile-eks-spark-lab

  # block device — 50GB is enough for Spark workloads in a lab
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 50Gi
        volumeType: gp3
        deleteOnTermination: true

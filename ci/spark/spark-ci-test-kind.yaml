apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi
  namespace: default

spec:
  type: Python
  pythonVersion: "3"
  mode: cluster

  image: apache/spark:3.5.1-python3
  imagePullPolicy: IfNotPresent

  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
  arguments:
    - "100"

  sparkVersion: "3.5.1"

  restartPolicy:
    type: Never

  driver:
    cores: 0.5
    coreLimit: "600m"
    memory: "256m"
    serviceAccount: spark

  executor:
    cores: 0.5
    instances: 1
    memory: "256m"
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-pi
  namespace: default

spec:
  type: Python
  pythonVersion: "3"
  mode: cluster

  image: apache/spark:3.5.1-python3
  imagePullPolicy: IfNotPresent

  mainApplicationFile: local:///opt/spark/examples/src/main/python/pi.py
  arguments:
    - "1000"

  sparkVersion: "3.5.1"

  restartPolicy:
    type: Never

  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "512m"
    labels:
      version: 3.5.1
    serviceAccount: spark

  executor:
    instances: 0     # CI optimization
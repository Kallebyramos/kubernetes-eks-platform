name: AI Infra PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "terraform/**"
      - "manifests/**"
      - ".github/**"

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch main branch
        run: git fetch origin main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate AI infra review
        id: review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          body=$(python .github/scripts/infra_pr_review.py)

          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.review.outputs.body }}
        with:
          script: |
            const body = `## 🤖 AI PR Analysis\n\n${process.env.BODY}`;

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });